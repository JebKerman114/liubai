name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v1.0.0); leave empty for build only"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            python_arch: x64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            python_arch: arm64
          - name: windows-x64
            runner: windows-2025
            python_arch: x64
          - name: windows-arm64
            runner: windows-11-arm
            python_arch: arm64
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon0 libdbus-1-3 fonts-noto-cjk flatpak squashfs-tools zstd
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python -c 'import os; from liubai import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          python tests/check_ui.py
      - name: Build native bundle and portable archive
        run: python scripts/build.py
      - name: Smoke test packaged application
        run: python scripts/smoke_bundle.py
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python scripts/package_linux.py
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dpkg-deb --info release/*.deb
          dpkg-deb --contents release/*.deb > build/deb-files.txt
          unsquashfs -s release/*.snap
          flatpak build-import --no-verify build/flatpak-check-repo release/*.flatpak
          sample_dir=$(mktemp -d)
          release/*.AppImage --appimage-extract-and-run --no-tray --smoke-test --data-dir "$sample_dir"
      - name: Package Windows
        if: runner.os == 'Windows'
        run: python scripts/package_windows.py
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: |
            release/*
            !release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previews-${{ matrix.name }}
          path: artifacts/*.png
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Check package count and generate checksums
        shell: bash
        run: |
          test "$(find release -type f | wc -l)" -eq 22
          cd release
          sha256sum * > SHA256SUMS
      - name: Publish
        shell: bash
        run: gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "留白 $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md
